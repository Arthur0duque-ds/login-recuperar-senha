<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <h1>Tela de login</h1>

        <form>
            <div class="form-control">
                <label for="Login">Login:</label>
                <input type="text" id="login" placeholder="Digite seu Login" />
            </div>

            <div class="form-control">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu Email" />
            </div>

            <div class="form-control">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua Senha" />
            </div>

            <div class="form-control">
                <div class="opcoes">
                    <input type="checkbox" id="Lembrar" />
                    <label for="Lembrar">lembrar meu login</label>
                </div>

                <div class="form-control">
                    <label>Tipo de acesso:</label>

                    <div class="opcoes">
                        <input type="radio" name="tipo" id="Aluno" />
                        <label for="aluno">Aluno</label>

                        <input type="radio" name="tipo" id="professor" />
                        <label for="professor">Professor</label>
                    </div>
                </div>
                    <div class="form-control">
                        <button type="submit">Entrar</button>
                    </div>

            </div>
            <a href="esqueci-senha.html">Esqueci minha Senha</a>
        </form>


    </div>



</body>

</html>
